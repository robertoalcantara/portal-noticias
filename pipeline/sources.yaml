# Fontes de notícia.
#
# Duas formas de fonte:
#   type: rss   -> feed RSS normal (feedparser)
#   type: list  -> site sem RSS: o pipeline lê a página de listagem e
#                  extrai os links de matéria que contenham "link_contains"
#
# Campo opcional em qualquer fonte:
#   extra_instructions: "..."  -> instrução extra aplicada só a essa fonte.
#     É usada na etapa de agrupamento/classificação (para decidir o que
#     descartar) e também passada ao modelo na hora de escrever a matéria,
#     como contexto extra sobre esse texto-fonte específico.
#
# Para adicionar/remover uma fonte, edite esta lista.

feeds:
  # --- Fórmula 1 / geral ---
  - name: "Motorsport.com"
    type: rss
    url: "https://www.motorsport.com/rss/all/news/"

  - name: "Autosport"
    type: rss
    url: "https://www.autosport.com/rss/all/news/"

  - name: "The Race"
    type: rss
    url: "https://the-race.com/feed/"

  - name: "RACER"
    type: rss
    url: "https://racer.com/feed/"

  - name: "Formula1.com"
    type: rss
    url: "https://www.formula1.com/en/latest/all.xml"

  - name: "FIA"
    type: rss
    url: "https://www.fia.com/rss/press-release"

  # ge.globo.com não expõe um RSS dedicado pra Fórmula 1 (só feeds
  # genéricos do G1/GE) -> raspagem da página de listagem, mesma técnica
  # dos outros sites sem RSS. link_contains cobre o padrão de URL de
  # matéria do Globo (".../noticia/AAAA/MM/DD/titulo.ghtml").
  - name: "ge Globo (F1)"
    type: list
    list_url: "https://ge.globo.com/motor/formula-1/"
    link_contains: "/noticia/"

  # --- Kart (europeu / internacional) ---
  # O feed RSS oficial (vroomkart.com/rss.xml) não funciona mais / mudou de
  # URL. O site não tem RSS ativo, então usamos raspagem da página de
  # notícias (mesma técnica dos sites brasileiros abaixo).
  - name: "Vroomkart"
    type: list
    list_url: "https://www.vroomkart.com/news"
    link_contains: "/news/"

  - name: "eKarting News"
    type: rss
    url: "https://ekartingnews.com/feed"

  - name: "TKART"
    type: list
    list_url: "https://tkart.it/en/news"
    link_contains: "/en/news/"

  - name: "Kartmag"
    type: rss
    url: "https://www.kartmag.fr/feed/"

  # --- Kart / automobilismo brasileiro (sem RSS -> raspagem da listagem) ---
  - name: "CBA"
    type: list
    list_url: "https://www.cba.org.br/"
    link_contains: "noticiasinfo"

  # --- Automobilismo brasileiro (geral, sem RSS -> raspagem da listagem) ---
  # "Revista Curva3" é o portal de automobilismo (F1, WEC, Le Mans etc.) do
  # site Autoentusiastas -- robots.txt permite raspagem (só bloqueia
  # /ae/wp-admin/). Sem feed RSS específico dessa seção (o site é
  # WordPress só com permalink padrão /AAAA/MM/titulo/, sem um trecho fixo
  # tipo "/noticia/" pra filtrar) -> link_contains usa "/20" (cobre
  # 2000-2099) em vez de travar num ano específico como "/2026/", que
  # quebraria sozinho na virada do ano.
  - name: "Autoentusiastas (Revista Curva3)"
    type: list
    list_url: "https://autoentusiastas.com.br/revistacurva3/"
    link_contains: "autoentusiastas.com.br/20"
