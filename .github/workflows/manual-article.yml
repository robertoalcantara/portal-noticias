name: Gerar matéria manual (link específico)

# Workflow separado do "Atualizar notícias": em vez de coletar de todas as
# fontes em sources.yaml, recebe um ou mais links específicos (parâmetro
# "urls") e gera UMA matéria a partir só deles — útil pra publicar algo na
# hora, sem esperar o RSS/listagem da fonte ser varrido pela rodada
# automática. Ver MANUAL_URLS / run_manual_mode() em pipeline/generate.py.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: >-
          Link(s) da matéria-fonte. Um por linha, ou separados por vírgula.
          Se mais de um link tratar do MESMO fato, todos viram fontes de
          UMA única matéria (igual ao agrupamento automático).
        required: true
        type: string
      images:
        description: >-
          Opcional — imagem(ns) pra usar na matéria em vez de tentar
          extrair da(s) página(s)-fonte. Link(s) por vírgula (só link
          funciona aqui; não dá pra anexar arquivo num workflow manual). A
          PRIMEIRA é a capa da matéria; as demais (se houver) são usadas
          nos cards de Stories, uma por card, em vez de repetir sempre a
          mesma foto.
        required: false
        type: string

# necessário para o job conseguir dar push da matéria nova
permissions:
  contents: write

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  gerar-manual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      - name: Gerar matéria a partir do(s) link(s) informado(s)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MANUAL_URLS: ${{ inputs.urls }}
          MANUAL_IMAGES: ${{ inputs.images }}
        run: python pipeline/generate.py

      - name: Commit e push
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add site/content/posts site/content/cards pipeline/seen.json site/static/images/ia site/static/images/cards
          if git diff --cached --quiet; then
            echo "Nada novo para publicar (nenhum link válido gerou matéria)."
          else
            git commit -m "Matéria manual ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi

      - name: Instalar Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.128.0"
          extended: true

      - name: Build do site
        working-directory: site
        run: hugo --gc --minify

      - name: Garantir que o projeto existe no Cloudflare Pages
        # "wrangler pages deploy" não cria o projeto sozinho em ambiente não
        # interativo. Depois da primeira vez, a API só retorna "já existe",
        # que é ignorado de propósito (|| true).
        run: |
          curl -s -o /dev/null -X POST "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"portal-noticias","production_branch":"main"}' || true

      - name: Deploy no Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/public --project-name=portal-noticias --branch=main
