name: Publicar Stories e feed no Instagram

# Workflow separado do "Atualizar notícias": publica os cards de Stories
# já gerados (qualquer matéria, de qualquer workflow) como Stories DE
# VERDADE em @gridgeral, e também um post de carrossel (ou imagem única)
# no FEED com as mesmas imagens -- via Instagram Graph API. Agendado pra
# rodar depois do funil principal -- a API do Instagram busca a imagem
# por URL pública, então o deploy do Cloudflare Pages precisa já ter
# acontecido antes de tentar publicar.
#
# Não gera nem publica matéria nenhuma -- só varre o que já está no site
# (site/content/posts/ + site/static/images/cards/) e publica (Stories e
# feed, cada um com seu próprio controle de já-publicados) o que ainda
# não foi publicado, respeitando cortes diários de segurança (o
# Instagram limita a API a 100 publicações/24h, somando todos os tipos
# de conteúdo). Ver pipeline/publish_instagram.py e a seção "Publicação
# automática no Instagram" no README pra pré-requisitos e configuração.
#
# Roda de hora em hora, das 6h às 23h no horário de Brasília (GMT-3) --
# 9h às 2h (do dia seguinte) em UTC. Cada rodada publica só o MAIS NOVO
# pendente de cada tipo (1 Story + 1 post de feed), nunca o backlog
# inteiro de uma vez -- ver MAX_STORIES_PER_RUN/MAX_FEED_POSTS_PER_RUN
# em pipeline/publish_instagram.py. Publicar tudo de uma vez (o que
# acontecia antes) deixava o perfil com uma rajada de posts todos juntos;
# de hora em hora fica mais espaçado e natural.
on:
  schedule:
    - cron: "15 9-23,0-2 * * *"   # de hora em hora, 6h-23h em GMT-3 (9h-2h UTC)
  workflow_dispatch: {}

# necessário para o job conseguir dar push do controle de já-publicados
permissions:
  contents: write

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  publicar-stories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Publicar Stories e feed pendentes
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: python pipeline/publish_instagram.py

      - name: Commit e push do controle de publicados
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add pipeline/instagram_posted.json pipeline/instagram_feed_posted.json
          if git diff --cached --quiet; then
            echo "Nada novo publicado nesta rodada."
            exit 0
          fi
          git commit -m "Stories publicadas no Instagram ($(date -u +%Y-%m-%dT%H:%MZ))"
          # o checkout deste job foi feito no início da run -- outro workflow
          # (ex.: "Atualizar notícias") pode ter dado push no main enquanto as
          # Stories estavam sendo publicadas (passo anterior demora minutos),
          # o que faria esse push simples falhar por non-fast-forward e
          # perder o registro de já-publicados (já aconteceu -- ver histórico).
          # Por isso: tenta rebase + push algumas vezes antes de desistir.
          for tentativa in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejeitado (tentativa $tentativa/5) -- rebaseando sobre origin/main e tentando de novo..."
            git fetch origin main
            git rebase origin/main
            sleep 5
          done
          echo "Não consegui dar push do controle de já-publicados após 5 tentativas." >&2
          exit 1
