name: Atualizar notícias

on:
  schedule:
    - cron: "0 * * * *"   # Equivale a 15h BSB
  workflow_dispatch: {}      # permite rodar manualmente pelo botão "Run workflow"

# necessário para o job conseguir dar push das novas matérias
permissions:
  contents: write

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      - name: Gerar matérias
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MAX_PER_FEED: "4"
        run: python pipeline/generate.py

      - name: Commit e push
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add site/content/posts site/content/cards pipeline/seen.json site/static/images/ia site/static/images/cards
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
          else
            git commit -m "Novas matérias ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi

      - name: Instalar Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.128.0"
          extended: true

      - name: Build do site
        working-directory: site
        run: hugo --gc --minify

      - name: Garantir que o projeto existe no Cloudflare Pages
        # "wrangler pages deploy" não cria o projeto sozinho em ambiente não
        # interativo. Depois da primeira vez, a API só retorna "já existe",
        # que é ignorado de propósito (|| true).
        run: |
          curl -s -o /dev/null -X POST "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"portal-noticias","production_branch":"main"}' || true

      - name: Deploy no Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/public --project-name=portal-noticias --branch=main
