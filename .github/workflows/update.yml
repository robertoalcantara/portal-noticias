name: Atualizar notícias

on:
  schedule:
    - cron: "0 */3 * * *"   # a cada 3 horas (horário UTC)
  workflow_dispatch: {}      # permite rodar manualmente pelo botão "Run workflow"

# necessário para o job conseguir dar push das novas matérias
permissions:
  contents: write

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      - name: Gerar matérias
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_PER_FEED: "5"
        run: python pipeline/generate.py

      - name: Commit e push
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add site/content/posts pipeline/seen.json
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
          else
            git commit -m "Novas matérias ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
