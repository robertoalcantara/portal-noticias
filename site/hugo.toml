# baseURL do site -- domínio próprio gridgeral.com, conectado ao projeto
# "portal-noticias" do Cloudflare Pages (que continua acessível também
# pelo endereço portal-noticias-cz7.pages.dev, mas o canônico é este).
# www.gridgeral.com também está configurado no Cloudflare Pages e
# redireciona pra este (ver Redirect Rule na zona gridgeral.com).
baseURL = "https://gridgeral.com/"
languageCode = "pt-br"
title = "Grid Geral"
enableRobotsTXT = true
paginate = 20
timeZone = "America/Fortaleza"

[params]
  tagline = "Kart, F1, F2, F3, GT3, WEC, Indy e NASCAR"
  description = "Cobertura de Kart, Fórmula 1, F2, F3, GT3, WEC, IndyCar e NASCAR — Brasil e o mundo."

[taxonomies]
  categoria = "categories"
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true              # permite HTML dentro do Markdown das matérias

[permalinks]
  posts = "/:year/:month/:slug/"
  cards = "/:year/:month/:slug/cards/"
