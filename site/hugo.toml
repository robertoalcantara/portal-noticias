# baseURL do site publicado no Cloudflare Pages (projeto "portal-noticias").
# O Cloudflare adicionou um sufixo aleatório ao subdomínio (comum quando o
# nome já tem alguma colisão). Se você conectar um domínio próprio depois
# (ex.: brgrid.com.br), troque aqui.
baseURL = "https://portal-noticias-cz7.pages.dev/"
languageCode = "pt-br"
title = "BRGrid"
enableRobotsTXT = true
paginate = 20
timeZone = "America/Fortaleza"

[params]
  tagline = "Kart, F1, F2, F3, GT3, WEC, Indy e NASCAR"
  description = "Cobertura de Kart, Fórmula 1, F2, F3, GT3, WEC, IndyCar e NASCAR — Brasil e o mundo."

[taxonomies]
  categoria = "categories"
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true              # permite HTML dentro do Markdown das matérias

[permalinks]
  posts = "/:year/:month/:slug/"
