<header class="site-head">
  <div class="wrap head-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-mark">GRID</span>
      <span class="brand-tag">{{ site.Params.tagline }}</span>
    </a>
    <nav class="nav" aria-label="Categorias">
      <a href="{{ "/posts/" | relURL }}">Últimas</a>
      {{ range $name, $terms := site.Taxonomies.categories }}
        <a href="{{ printf "/categories/%s/" $name | relURL }}">{{ $name | title }}</a>
      {{ end }}
    </nav>
  </div>
</header>
